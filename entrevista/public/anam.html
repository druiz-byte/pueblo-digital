<!-- ── Consentimiento de cookies + Google Analytics 4 ─────────────────────────
     CookieConsent v3 (Orest Bida, MIT, gratuito) en lugar de CookieHub.
     GA4 (G-BQH2YG2XRG) NO se carga hasta que el visitante acepta "Analítica":
     antes de eso no hay ninguna cookie de Google. Los eventos que se lanzan antes
     de aceptar se guardan en cola y se envían si acepta; si rechaza, se descartan.
     Mismo bloque en index.html, entrevista/public/encuesta.html y anam.html. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.1.0/dist/cookieconsent.css">
<script>
  window.dataLayer = window.dataLayer || [];
  var GA_ID = 'G-BQH2YG2XRG';
  var _gaCargado = false, _gaCola = [];
  function _gaPush(){ dataLayer.push(arguments); }
  // gtag() de siempre: antes del consentimiento solo encola (máx. 100 llamadas)
  function gtag(){ if (_gaCargado) dataLayer.push(arguments); else if (_gaCola.length < 100) _gaCola.push(arguments); }
  // Evento GA4 seguro: nunca rompe la página
  function track(name, params){ try { gtag('event', name, params || {}); } catch(e){} }
  function cargarGA(){
    if (_gaCargado) { _gaPush('consent', 'update', { analytics_storage: 'granted' }); return; }
    _gaCargado = true;
    _gaPush('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied',
                                    ad_personalization: 'denied', analytics_storage: 'granted' });
    _gaPush('js', new Date());
    _gaPush('config', GA_ID);
    _gaCola.forEach(function(a){ dataLayer.push(a); }); _gaCola = [];
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
  }
  function retirarGA(){
    _gaCola = [];
    if (_gaCargado) _gaPush('consent', 'update', { analytics_storage: 'denied' });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.1.0/dist/cookieconsent.umd.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function(){
    if (!window.CookieConsent) return;   // CDN bloqueada: la página sigue funcionando, sin GA
    function aplicar(){ CookieConsent.acceptedCategory('analytics') ? cargarGA() : retirarGA(); }
    CookieConsent.run({
      guiOptions: {
        consentModal: { layout: 'box', position: 'bottom left', equalWeightButtons: true },
        preferencesModal: { layout: 'box', equalWeightButtons: true }
      },
      categories: {
        necessary: { enabled: true, readOnly: true },
        analytics: { autoClear: { cookies: [ { name: /^_ga/ }, { name: '_gid' } ] } }
      },
      onConsent: aplicar,
      onChange: aplicar,
      language: {
        default: 'es',
        translations: { es: {
          consentModal: {
            title: 'Cookies de analítica',
            description: 'Pueblo Digital es un proyecto de investigación de la Universidad de Deusto. Con tu permiso usamos Google Analytics para saber cuántas personas visitan estas páginas y cómo llegan a ellas. No usamos cookies publicitarias.',
            acceptAllBtn: 'Aceptar',
            acceptNecessaryBtn: 'Rechazar',
            showPreferencesBtn: 'Configurar'
          },
          preferencesModal: {
            title: 'Preferencias de cookies',
            acceptAllBtn: 'Aceptar todas',
            acceptNecessaryBtn: 'Rechazar todas',
            savePreferencesBtn: 'Guardar preferencias',
            closeIconLabel: 'Cerrar',
            sections: [
              { title: 'Necesarias',
                description: 'Guardan tu elección sobre las cookies (cookie <code>cc_cookie</code>). Son imprescindibles y no se pueden desactivar.',
                linkedCategory: 'necessary' },
              { title: 'Analítica',
                description: 'Google Analytics 4: páginas vistas, origen de la visita y uso de la encuesta y la entrevista, de forma agregada. Cookies <code>_ga</code> y <code>_ga_*</code>, hasta 2 años.',
                linkedCategory: 'analytics' },
              { title: 'Más información',
                description: 'Para cualquier duda sobre estos datos: <a href="mailto:druiz@deusto.es">druiz@deusto.es</a>.' }
            ]
          }
        } }
      }
    });
  });
</script>

<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#67707c; --line:#e4e8ee; --accent:#2f6df6; --head:54px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); overflow:hidden; }
  header { height:var(--head); display:flex; flex-direction:column; justify-content:center;
           padding:6px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:16px; }
  header .sub { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 8px; margin-left:6px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .btn { border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.ghost { background:#eef1f6; color:var(--ink); }
  .btn:disabled { opacity:.5; cursor:default; }

  /* ── Móvil primero: apilado vertical ─────────────────────────────── */
  .app { display:flex; flex-direction:column; gap:10px; padding:10px;
         height:calc(100dvh - var(--head)); overflow:hidden; }

  /* Ficha: en móvil solo el resumen; el detalle se oculta */
  .ficha { padding:10px 12px; }
  .resumen { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .resumen .nom { font-size:17px; font-weight:600; }
  .resumen .meta { color:var(--muted); font-size:13px; }
  .ficha-detalle { display:none; }

  .stage { position:relative; overflow:hidden; background:#0d1117; border-radius:12px;
           display:flex; align-items:center; justify-content:center; height:38vh; min-height:220px; }
  #video { width:100%; height:100%; object-fit:cover; display:none; }
  #video.on { display:block; }
  .stage .ph { color:#98a2b3; text-align:center; padding:16px; font-size:14px; }
  .stage .controls { position:absolute; top:10px; left:10px; display:flex; gap:8px; }

  .chat { display:flex; flex-direction:column; flex:1; min-height:0; padding:10px; }
  #transcript { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 10px; border-radius:10px; max-width:92%; }
  .msg.user { background:#eaf1ff; align-self:flex-end; }
  .msg.agent { background:#f1f3f7; align-self:flex-start; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .msg.sys { align-self:center; color:var(--muted); font-size:12px; background:transparent; text-align:center; }
  .composer { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .composer input { flex:1; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
  .composer #send { display:none; }   /* en móvil no hay Enviar: se usa el micrófono o Enter */
  .lang { flex:0 0 auto; padding:9px 6px; border:1px solid var(--line); border-radius:8px;
          background:#eef1f6; color:var(--ink); font-size:13px; cursor:pointer; }
  .lang:disabled { opacity:.5; }
  .mic { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#eef1f6;
         font-size:19px; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .mic.on { background:#ffe1e1; border-color:#ff9d9d; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,80,80,.5); } 50%{ box-shadow:0 0 0 6px rgba(255,80,80,0); } }

  /* Ficha detallada (secciones) */
  .sec { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 4px; font-weight:600; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .row .k { color:var(--muted); }
  .row .v { text-align:right; }

  /* ── Escritorio: 3 columnas, ficha detallada visible ─────────────── */
  @media (min-width:900px) {
    .app { display:grid; grid-template-columns:340px 1fr 380px; gap:16px; padding:16px;
           height:calc(100vh - var(--head)); min-height:0; }
    .ficha { padding:14px; overflow:auto; }
    .resumen { display:none; }
    .ficha-detalle { display:block; }
    .ficha-detalle h2 { font-size:16px; margin:.1em 0 .5em; }
    .stage { height:auto; }
    .chat { min-height:0; }
    .composer #send { display:block; }   /* en escritorio sí aparece Enviar */
  }
</style>
</head>
<body>
<header>
  <h1>Pueblo Digital · Entrevista <span id="match-badge" class="badge" style="display:none"></span></h1>
  <div class="sub">Cara y voz asignadas automáticamente al perfil · Anam</div>
</header>

<div class="app">
  <section class="panel ficha" id="ficha">
    <div class="resumen" id="resumen"><span class="nom">Cargando…</span></div>
    <div class="ficha-detalle" id="detalle"></div>
  </section>

  <section class="panel stage">
    <div class="controls">
      <button id="btn-connect" class="btn primary">🎙 Hablar con la Persona</button>
      <button id="btn-stop" class="btn ghost" style="display:none">Terminar</button>
    </div>
    <video id="video" autoplay playsinline></video>
    <div class="ph" id="ph">Pulsa «Hablar con la Persona» para conectar el avatar.</div>
  </section>

  <section class="panel chat">
    <div id="transcript"><div class="msg sys">La conversación aparecerá aquí.</div></div>
    <div class="composer">
      <select id="lang" class="lang" title="Idioma de la pregunta" disabled>
        <option value="es">ES</option>
        <option value="eu">EU</option>
      </select>
      <input id="q" placeholder="Escribe o pulsa el micrófono…" disabled>
      <button id="mic" class="mic" title="Hablar por voz" style="display:none">🎤</button>
      <button id="send" class="btn primary" disabled>Enviar</button>
    </div>
  </section>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@anam-ai/js-sdk@latest";
import { AnamEvent } from "https://esm.sh/@anam-ai/js-sdk@latest/dist/module/types";

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const ID = params.get("id") || "1";
let persona = null, anam = null, history = [];

// ── Voz de salida en euskera (síntesis del navegador) ─────────────────────
// El avatar de Anam solo tiene voces en castellano; para que una respuesta en
// euskera no suene con acento castellano, cuando el turno es en euskera
// silenciamos el audio del avatar (sigue moviendo los labios) y locutamos el
// texto con una voz vasca del navegador si existe. Si no hay voz vasca, se
// mantiene la voz del avatar (castellana) como respaldo.
const synth = window.speechSynthesis || null;
let euVoice = null;
function cargarVozEu(){
  if(!synth) return;
  const vs = synth.getVoices() || [];
  euVoice = vs.find(v => /^eu(-|_|$)/i.test(v.lang)) ||
            vs.find(v => /basque|euskera|euskara/i.test(v.name)) || null;
}
if(synth){ cargarVozEu(); synth.onvoiceschanged = cargarVozEu; }
function hablarEu(texto){
  return new Promise(res => {
    if(!synth || !euVoice){ res(false); return; }
    try { synth.cancel(); } catch(_){}
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = euVoice; u.lang = euVoice.lang || "eu-ES"; u.rate = 1;
    u.onend = () => res(true); u.onerror = () => res(true);
    synth.speak(u);
  });
}

// Voz euskera nativa vía Azure TTS (servidor). Devuelve true si sonó.
let audioEu = null;
async function hablarEuAzure(texto){
  try {
    const r = await fetch("/api/tts", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id: ID, text: texto })
    });
    if(!r.ok) return false;                       // sin clave o error → respaldo
    const url = URL.createObjectURL(await r.blob());
    if(audioEu){ try { audioEu.pause(); } catch(_){} }
    audioEu = new Audio(url);
    await new Promise(res => {
      audioEu.onended = res; audioEu.onerror = res;
      audioEu.play().catch(() => res());
    });
    URL.revokeObjectURL(url);
    return true;
  } catch(_){ return false; }
}

const esc = t => (t==null?"":String(t)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function sys(t){ add("sys","",t); }
function add(type, who, text){
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerHTML = (who?`<div class="who">${esc(who)}</div>`:"") + `<div class="content">${esc(text)}</div>`;
  $("#transcript").appendChild(d);
  $("#transcript").scrollTop = $("#transcript").scrollHeight;
  return d;
}

// ── Ficha ────────────────────────────────────────────────────────────────
function fila(k,v){ return (v==null||v==="")?"":`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`; }
function seccion(t){ return `<div class="sec">${esc(t)}</div>`; }

function pintarFicha(a){
  // Resumen (móvil)
  $("#resumen").innerHTML =
    `<span class="nom">${esc(a.nombre)} ${esc(a.apellidos||"")}</span>` +
    `<span class="meta">${esc(a.edad)} años · ${esc(a.provincia)}</span>`;

  // Detalle (escritorio) — campos del panel v2
  const H = [`<h2>${esc(a.nombre)} ${esc(a.apellidos||"")}</h2>`];
  H.push(seccion("Perfil personal"));
  H.push(fila("Edad", a.edad), fila("Género", a.genero), fila("Provincia", a.provincia),
         fila("Hábitat", a.habitat), fila("Estudios", a.nivel_estudios),
         fila("Situación laboral", a.situacion_laboral), fila("Clase social", a.clase_social),
         fila("Lugar de nacimiento", a.nacimiento), fila("Problemas fin de mes", a.problemas_dinero));
  H.push(seccion("Perfil lingüístico"));
  H.push(fila("Euskera", a.euskera), fila("Idioma preferido", a.lengua_encuesta));
  H.push(seccion("Perfil político"));
  H.push(fila("Voto autonómicas 2024", a.voto_autonomicas_2024), fila("Identidad", a.identidad),
         fila("Postura territorial", a.preferencia_territorial),
         fila("Ideología (0-10)", a.ideologia_0_10),
         fila("Nacionalismo (0-10)", a.escala_nacionalismo_0_10),
         fila("Valoración economía PV", a.valoracion_economia_pv),
         fila("Valoración política PV", a.valoracion_politica_pv),
         fila("Interés por la política", a.interes_politica),
         fila("Seguridad percibida", a.seguridad_percibida),
         fila("Preocupaciones", (a.principales_problemas||[]).join(", ")));
  const m = a.perfil_mediatico;
  if (m) { H.push(seccion("Perfil mediático"));
    H.push(fila("Noticias (min/día)", m.consumo_noticias_min_dia),
           fila("Uso de internet", m.uso_internet),
           fila("Confianza políticos (0-10)", m.confianza_politicos_0_10),
           fila("Confianza parlamento (0-10)", m.confianza_parlamento_0_10)); }
  const b = a.perfil_bienestar;
  if (b) { H.push(seccion("Bienestar"));
    H.push(fila("Felicidad (0-10)", b.felicidad_0_10),
           fila("Satisfacción vital (0-10)", b.satisfaccion_vida_0_10),
           fila("Salud autopercibida", b.salud_autopercibida),
           fila("Contacto social", b.contacto_social),
           fila("Sentimiento de soledad", b.sentimiento_soledad)); }
  const s = a.perfil_social;
  if (s) { H.push(seccion("Capital social (0-10)"));
    H.push(fila("Confianza en personas", s.confianza_general_0_10),
           fila("Confianza instituciones", s.confianza_instituciones_0_10),
           fila("Confianza profesiones", s.confianza_profesiones_0_10),
           fila("Participación social", s.participacion_social_0_10),
           fila("Pertenencia asociaciones", s.pertenencia_asociaciones_0_10),
           fila("Cohesión social", s.cohesion_social_0_10),
           fila("Percepción de corrupción", s.percepcion_corrupcion_0_10),
           fila("Sensación de seguridad", s.seguridad_0_10)); }
  $("#detalle").innerHTML = H.join("");
}

async function cargarFicha(){
  const r = await fetch("/api/agentes/" + encodeURIComponent(ID));
  if(!r.ok){ $("#resumen").innerHTML = `<span class="nom">Persona ${esc(ID)} no encontrada</span>`; return; }
  persona = await r.json();
  pintarFicha(persona);
  const eus = (persona.euskera || "").toLowerCase();
  const esEuskaldun = eus.includes("euskaldun") && (eus.includes("habla bien") || eus.includes("bastante bien"));
  if(esEuskaldun){
    const opt = $("#lang").querySelector('option[value="eu"]');
    if(opt) opt.textContent = "EU ✓";
    $("#lang").title = "Esta Persona es euskaldun: elige EU para preguntar y que responda en euskera.";
  }
}

// ── Conectar avatar (cara+voz emparejadas por el servidor) ────────────────
async function connect(){
  $("#btn-connect").disabled = true;
  sys("Emparejando cara y voz con el perfil…");
  try {
    const r = await fetch("/api/anam/session", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id: ID })
    });
    const data = await r.json();
    if(!r.ok || !data.sessionToken)
      throw new Error(typeof data.error==="string"?data.error:JSON.stringify(data.error||data));
    const m = data.match;
    const bdg = $("#match-badge");
    bdg.textContent = `${m.celda} · ${m.claveVoz}`; bdg.style.display = "inline-block";

    anam = createClient(data.sessionToken, { disableInputAudio: true });
    anam.addListener(AnamEvent.SESSION_READY, () => {
      track('entrevista_iniciada', { persona_id: String(ID), celda: m.celda, voz: m.claveVoz });
      $("#ph").style.display = "none";
      $("#video").classList.add("on");
      $("#q").disabled = false; $("#send").disabled = false;
      $("#lang").disabled = false;
      $("#btn-stop").style.display = "inline-block";
      if (SR) $("#mic").style.display = "flex";
      presentarse();
    });
    anam.addListener(AnamEvent.CONNECTION_CLOSED, () => { anam = null; sys("Conexión cerrada."); });
    await anam.streamToVideoElement("video");
  } catch(e){
    sys("Error al conectar: " + e.message);
    $("#btn-connect").disabled = false;
  }
}

async function stop(){
  try { if(anam) await anam.stopStreaming(); } catch(_){}
  anam = null;
  $("#video").classList.remove("on");
  $("#ph").style.display = "";
  $("#q").disabled = true; $("#send").disabled = true; $("#mic").style.display = "none";
  $("#lang").disabled = true;
  try { synth && synth.cancel(); } catch(_){}
  try { if(audioEu) audioEu.pause(); } catch(_){}
  $("#btn-stop").style.display = "none"; $("#btn-connect").disabled = false;
  sys("Sesión terminada.");
}

// ── Locución de una respuesta: avatar (castellano) o passthrough euskera ──
async function decir(texto, lang){
  if(!texto) return;
  const video = $("#video");
  if(lang !== "eu"){
    if(video) video.muted = false;
    if(anam) await anam.talk(texto);
    return;
  }
  // Turno en euskera: el avatar mueve los labios con la voz castellana silenciada
  // y locutamos el texto en euskera. Prioridad: Azure (nativo) → navegador → avatar.
  if(video) video.muted = true;
  const labios = anam ? anam.talk(texto).catch(() => {}) : Promise.resolve();
  let ok = await hablarEuAzure(texto);
  if(!ok) ok = await hablarEu(texto);
  if(!ok && video) video.muted = false;   // sin voz euskera: se oye el avatar (castellano)
  await labios;
  if(video) video.muted = false;
}

// ── Auto-presentación al conectar (sin esperar pregunta) ──────────────────
async function presentarse(){
  const instruccion = "Preséntate en 1-2 frases, en tono cercano y natural: di tu " +
    "nombre, tu edad, de dónde eres y a qué te dedicas. No hagas preguntas.";
  const pensando = add("agent", persona.nombre, "…");
  try {
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ agentId: persona.id, messages: [{ role:"user", content: instruccion }] })
    });
    const data = await r.json();
    if(!r.ok || data.error) throw new Error((data.error&&data.error.message)||data.error||("HTTP "+r.status));
    const reply = data.text;
    pensando.querySelector(".content").textContent = reply;
    history.push({ role:"assistant", content: reply });   // el saludo entra en el contexto
    await decir(reply, "es");   // la autopresentación siempre en castellano
  } catch(e){
    pensando.querySelector(".content").textContent = "[Error: " + e.message + "]";
  }
}

// ── Pregunta → Claude (cerebro) → talk() ──────────────────────────────────
async function preguntar(){
  const q = $("#q").value.trim();
  if(!q) return;
  const lang = $("#lang").value;   // idioma del turno (dirige la voz de salida)
  $("#q").value = ""; $("#q").disabled = true; $("#send").disabled = true;
  add("user","Entrevistador", q);
  track('entrevista_pregunta', { persona_id: String(ID), idioma: lang, n_turno: history.filter(h => h.role === 'user').length + 1 });
  history.push({ role:"user", content:q });
  const pensando = add("agent", persona.nombre, "…");
  try {
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ agentId: persona.id, messages: history })
    });
    const data = await r.json();
    if(!r.ok || data.error) throw new Error((data.error&&data.error.message)||data.error||("HTTP "+r.status));
    const reply = data.text;
    pensando.querySelector(".content").textContent = reply;
    history.push({ role:"assistant", content: reply });
    await decir(reply, lang);
  } catch(e){
    pensando.querySelector(".content").textContent = "[Error: " + e.message + "]";
  }
  $("#q").disabled = false; $("#send").disabled = false; $("#q").focus();
}

// ── Voz: dictado con Web Speech API (es-ES) ───────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, escuchando = false;
function toggleMic(){
  if(!SR){ sys("Este navegador no permite dictado por voz."); return; }
  if(escuchando){ recog && recog.stop(); return; }
  recog = new SR();
  recog.lang = $("#lang").value === "eu" ? "eu-ES" : "es-ES";
  recog.interimResults = true; recog.continuous = false;
  recog.onresult = e => {
    let t = "";
    for(const res of e.results) t += res[0].transcript;
    $("#q").value = t;
  };
  recog.onerror = () => { escuchando = false; $("#mic").classList.remove("on"); };
  recog.onend = () => {
    escuchando = false; $("#mic").classList.remove("on");
    if($("#q").value.trim()) preguntar();
  };
  try { recog.start(); escuchando = true; $("#mic").classList.add("on"); }
  catch(_){ /* start puede fallar si ya está activo */ }
}

$("#btn-connect").addEventListener("click", connect);
$("#btn-stop").addEventListener("click", stop);
$("#send").addEventListener("click", preguntar);
$("#mic").addEventListener("click", toggleMic);
$("#q").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); preguntar(); }});

// Cierra la sesión de Anam al salir/cerrar la pestaña (libera el cupo de concurrencia)
window.addEventListener("pagehide", () => { try { synth && synth.cancel(); if(anam) anam.stopStreaming(); } catch(_){} });
window.addEventListener("beforeunload", () => { try { synth && synth.cancel(); if(anam) anam.stopStreaming(); } catch(_){} });

cargarFicha();
