# ─────────────────────────────────────────────────────────────
#  Render Blueprint — despliega la app de entrevista (panel v2)
#  En Render: New → Blueprint → conecta el repo → se lee este archivo.
#  Las 3 variables marcadas sync:false se rellenan en el panel de Render.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: pueblo-digital-entrevista
    runtime: python
    rootDir: entrevista
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server_anam.py"
    autoDeploy: true
    envVars:
      # Contraseña de acceso (Basic Auth). Ponla para que no la use cualquiera.
      - key: SITE_PASSWORD
        sync: false
      # Clave de Anam (avatar + voz emparejados). Rellenar en el panel de Render.
      - key: ANAM_API_KEY
        sync: false
      # Clave de Anthropic (Claude Haiku responde como la Persona)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Azure Speech: voz en euskera de las Personas euskaldun. KEY 1 del recurso
      # Speech (capa gratuita F0). Rellenar en el panel de Render.
      - key: AZURE_SPEECH_KEY
        sync: false
      # Región del recurso Speech (no es secreta; puede ir con valor directo).
      - key: AZURE_SPEECH_REGION
        value: westeurope
      # Copia persistente de las encuestas en GitHub (el disco de Render es efímero).
      # Fine-grained PAT con "Contents: Read and write" sobre druiz-byte/pueblo-digital.
      - key: GITHUB_TOKEN
        sync: false
